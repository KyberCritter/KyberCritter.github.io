<div class="{{ include.row_class }}">
    <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener"
       class="{{ include.link_class }}" aria-label="GitHub">
        <i class="fab fa-github {{ include.icon_class }}" aria-hidden="true"></i>
    </a>
    <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener"
       class="{{ include.link_class }}" aria-label="LinkedIn">
        <i class="fab fa-linkedin {{ include.icon_class }}" aria-hidden="true"></i>
    </a>
    <a href="https://www.youtube.com/@{{ site.youtube_username }}" target="_blank" rel="noopener"
       class="{{ include.link_class }}" aria-label="YouTube">
        <i class="fab fa-youtube {{ include.icon_class }}" aria-hidden="true"></i>
    </a>
    <a href="mailto:{{ site.email }}" class="{{ include.link_class }}" aria-label="Email">
        <i class="fas fa-envelope {{ include.icon_class }}" aria-hidden="true"></i>
    </a>
</div>
